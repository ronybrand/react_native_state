name: Setup GitHub Topics

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  administration: write

jobs:
  setup-topics:
    runs-on: ubuntu-latest
    steps:
      - name: Setup GitHub Topics
        uses: actions/github-script@v7
        with:
          script: |
            const topics = [
              'react-native',
              'expo',
              'typescript',
              'mobile-app',
              'android',
              'ios',
              'web',
              'expo-router',
              'tanstack-query',
              'react-query',
              'axios',
              'react-hook-form',
              'zod',
              'form-validation',
              'rest-api',
              'spring-boot',
              'expo-secure-store',
              'testing',
              'jest',
              'react-native-testing-library',
              'ci-cd',
              'github-actions',
              'security',
              'accessibility',
              'codeql',
              'husky',
              'prettier',
              'eslint'
            ];

            await github.rest.repos.replaceAllTopics({
              owner: context.repo.owner,
              repo: context.repo.repo,
              names: topics
            });
