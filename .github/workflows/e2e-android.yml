name: E2E (Android)

# Builds a release APK against the local mock API, installs it on an emulator and drives
# the real screens with Maestro. Jest cannot do this: it mocks the keychain, the router
# and the native alert, which are exactly what these flows exercise.
# A change that only touches docs cannot affect the app, so it should not spend ~15 minutes
# of emulator time. (If this check ever becomes required, a skipped workflow would block
# merging; revisit then.)
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/dependabot.yml'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/dependabot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # E2E=1 is read by app.config.ts and lets this build talk plain http to the mock
      # (Android blocks cleartext in release builds; the shipped app keeps blocking it).
      E2E: '1'
      # The emulator reaches the host's mock API through `adb reverse`.
      EXPO_PUBLIC_API_URL: http://localhost:4010
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      # Caches ~/.gradle (dependencies, wrapper and the build cache that holds compiled native
      # code). It only WRITES from the default branch: a pull request reads what `main` saved,
      # so the first run on `main` after merging is what makes every later run fast.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0.6.4.0.6.4.0
      # Nothing in this job needs a dependency's install script (the native build is Gradle's),
      # so none is allowed to run.
      - run: npm ci --ignore-scripts

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      # x86_64 only, because that is what the emulator runs. Lint-vital is skipped (see the init
      # script) and the Gradle build cache is on: once `main` has run this workflow and saved
      # the cache, a pull request reuses the compiled native code (the biggest part of the build).
      # (Caching the NDK and CMake was tried and dropped: restoring them cost about as much as
      # Gradle's own download and install, and the cache is over a gigabyte.)
      - name: Build the release APK
        working-directory: android
        run: >-
          ./gradlew assembleRelease
          -PreactNativeArchitectures=x86_64
          -I ../e2e/gradle/skip-lint-vital.gradle
          --build-cache --parallel --no-daemon

      # Pinned to a release and checked against the project's published checksum
      # (checksums_sha256.txt of cli-2.11.0), instead of piping an installer into a shell.
      - name: Install Maestro
        env:
          MAESTRO_VERSION: cli-2.11.0
          MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/maestro.zip"             "https://github.com/mobile-dev-inc/maestro/releases/download/${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  ${RUNNER_TEMP}/maestro.zip" | sha256sum --check --strict -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-unpacked"
          mkdir -p "$HOME/.maestro"
          cp -r "$RUNNER_TEMP/maestro-unpacked/maestro/." "$HOME/.maestro/"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Creating the AVD and cold-booting it costs about a minute and a half. The first run saves
      # a booted snapshot; later runs restore it. Both emulator steps must use the same hardware
      # settings, or the snapshot would not match.
      - name: Cache the emulator snapshot
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-api34-x86_64-pixel_6-v1

      - name: Create the emulator snapshot (only when it is not cached)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated the AVD snapshot for caching."

      - name: Run the flows on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          # Software rendering is CPU-bound; more cores and memory keep the launcher responsive.
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          # -no-snapshot-save: boot from the cached snapshot and do not rewrite it.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true
          # One line: the action runs a multi-line script line by line.
          script: bash e2e/run-flows.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: maestro-results
          path: |
            e2e-reports/
            ~/.maestro/tests/
          retention-days: 7
