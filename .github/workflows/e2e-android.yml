name: E2E (Android)

# Builds a release APK against the local mock API, installs it on an emulator and drives
# the real screens with Maestro. Jest cannot do this: it mocks the keychain, the router
# and the native alert, which are exactly what these flows exercise.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # E2E=1 is read by app.config.ts and lets this build talk plain http to the mock
      # (Android blocks cleartext in release builds; the shipped app keeps blocking it).
      E2E: '1'
      # The emulator reaches the host's mock API through `adb reverse`.
      EXPO_PUBLIC_API_URL: http://localhost:4010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      # x86_64 only, because that is what the emulator runs.
      - name: Build the release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          # Software rendering is CPU-bound; more cores and memory keep the launcher responsive.
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # One line: the action runs a multi-line script line by line.
          script: bash e2e/run-flows.sh

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: maestro-results
          path: |
            e2e-reports/
            ~/.maestro/tests/
          retention-days: 7
