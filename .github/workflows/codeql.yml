name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A Dependabot pull request gets a read-only token and no access to secrets, so
    # CodeQL cannot upload its results there and the job fails for a reason that has
    # nothing to do with the change. The bump is still analyzed once it lands on main.
    if: github.actor != 'dependabot[bot]'
    permissions:
      # Listing permissions drops the defaults, so a private repository also
      # needs contents: read (checkout) and actions: read (CodeQL's run lookup).
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
