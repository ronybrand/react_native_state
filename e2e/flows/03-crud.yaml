# Create, edit and delete a state through the real screens, against the mock API.
appId: com.ronybrand.estados
---
- runFlow: helpers/launch-clean.yaml
- runFlow: helpers/dismiss-system-dialogs.yaml
- runFlow: helpers/login.yaml
# Create
- tapOn: 'New state'
- tapOn:
    id: 'state-abbreviation'
- inputText: 'BA'
- tapOn:
    id: 'state-name'
- inputText: 'Bahia'
- hideKeyboard
- tapOn: 'Save'
- assertVisible: 'Bahia'
# Edit
- tapOn: 'Edit BA'
- tapOn:
    id: 'state-name'
- eraseText: 50
- inputText: 'Bahia Updated'
- hideKeyboard
- tapOn: 'Save'
- assertVisible: 'Bahia Updated'
# Delete: the native alert asks first, and Cancel keeps the row
- tapOn: 'Delete BA'
- assertVisible: 'Are you sure you want to delete BA?'
- tapOn: 'Cancel'
- assertVisible: 'Bahia Updated'
- tapOn: 'Delete BA'
- tapOn:
    text: 'Delete'
    childOf:
      id: '.*buttonPanel'
- assertNotVisible: 'Bahia Updated'
