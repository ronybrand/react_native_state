# Signs in through the Login screen, from the list. Used by the flows that need a session.
appId: com.ronybrand.estados
---
- tapOn: 'Log in'
- tapOn:
    id: 'login-username'
- inputText: 'admin'
- tapOn:
    id: 'login-password'
- inputText: 'e2e-password'
- hideKeyboard
- tapOn: 'Log in'
- assertVisible: 'Log out'
